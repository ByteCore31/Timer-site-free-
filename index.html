<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #090a10;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .glow-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45;
    }
    .b1 { width: 300px; height: 300px; background: #00f0ff; top: -50px; left: -50px; }
    .b2 { width: 300px; height: 300px; background: #ff007b; bottom: -50px; right: -50px; }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 440px;
      background: rgba(18, 20, 36, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
      padding: 24px 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 14px; }
    .tab {
      flex: 1; padding: 10px; border: none; background: transparent; color: #8b92a5;
      font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer;
    }
    .tab.active { background: #00f0ff; color: #050814; box-shadow: 0 0 15px rgba(0,240,255,0.4); }
    .panel { display: none; flex-direction: column; align-items: center; }
    .panel.active { display: flex; }
    .circle-wrap { position: relative; width: 220px; height: 220px; margin: 10px 0 15px; display: flex; justify-content: center; align-items: center; }
    svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    circle { fill: none; stroke-width: 8; stroke-linecap: round; }
    .c-bg { stroke: rgba(255, 255, 255, 0.08); }
    .c-prog { stroke: #00f0ff; stroke-dasharray: 628; stroke-dashoffset: 0; transition: stroke-dashoffset 0.25s linear; }
    .display { position: absolute; font-family: 'Orbitron', monospace; font-size: 32px; font-weight: 900; }
    .inputs { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
    .box { display: flex; flex-direction: column; align-items: center; }
    .box input {
      width: 60px; height: 44px; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px;
      color: #fff; font-family: 'Orbitron'; font-size: 18px; text-align: center; outline: none;
    }
    .box span { font-size: 10px; color: #8b92a5; margin-top: 3px; }
    .btns { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; padding: 12px; border: none; border-radius: 14px; font-weight: 700;
      font-size: 15px; cursor: pointer; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-main { background: #00f0ff; color: #040814; }
    .btn-stop { background: #ff007b; color: #fff; }
    .btn-sec { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .clock-big { font-family: 'Orbitron'; font-size: 38px; margin: 15px 0 20px; color: #ff007b; }
    .alarm-row { display: flex; gap: 6px; width: 100%; margin-bottom: 12px; }
    .alarm-row input {
      padding: 8px 10px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; color: #fff; outline: none;
    }
    .alarm-list { width: 100%; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .alarm-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05); border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="glow-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabTimer">Таймер</button>
      <button class="tab" id="tabAlarm">Будильник</button>
      <button class="tab" id="tabSw">Секундомер</button>
    </div>

    <!-- ТАЙМЕР -->
    <div class="panel active" id="panelTimer">
      <div class="circle-wrap">
        <svg viewBox="0 0 220 220">
          <circle class="c-bg" cx="110" cy="110" r="100"></circle>
          <circle class="c-prog" id="prog" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="display" id="timerDisp">00:05:00</div>
      </div>
      <div class="inputs">
        <div class="box"><input type="number" id="h" value="0"><span>Часы</span></div>:
        <div class="box"><input type="number" id="m" value="5"><span>Минуты</span></div>:
        <div class="box"><input type="number" id="s" value="0"><span>Секунды</span></div>
      </div>
      <div class="btns">
        <button class="btn btn-main" id="btnTimerStart">Старт</button>
        <button class="btn btn-sec" id="btnTimerReset">Сброс</button>
      </div>
    </div>

    <!-- БУДИЛЬНИК -->
    <div class="panel" id="panelAlarm">
      <div class="clock-big" id="realClock">00:00:00</div>
      <div class="alarm-row">
        <input type="time" id="alarmTime" style="flex:1;">
        <input type="text" id="alarmTxt" placeholder="Название" style="flex:1.5;">
        <button class="btn btn-main" id="btnAddAlarm" style="flex:0; padding:8px 16px;">+</button>
      </div>
      <div class="alarm-list" id="alarmList"></div>
    </div>

    <!-- СЕКУНДОМЕР -->
    <div class="panel" id="panelSw">
      <div class="display" id="swDisp" style="position:static; margin: 25px 0;">00:00.00</div>
      <div class="btns">
        <button class="btn btn-main" id="btnSwStart">Старт</button>
        <button class="btn btn-sec" id="btnSwReset">Сброс</button>
      </div>
    </div>
  </div>

  <script>
    // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---
    function setTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      if (name === 'timer') {
        document.getElementById('tabTimer').classList.add('active');
        document.getElementById('panelTimer').classList.add('active');
      } else if (name === 'alarm') {
        document.getElementById('tabAlarm').classList.add('active');
        document.getElementById('panelAlarm').classList.add('active');
      } else {
        document.getElementById('tabSw').classList.add('active');
        document.getElementById('panelSw').classList.add('active');
      }
    }

    document.getElementById('tabTimer').onclick = () => setTab('timer');
    document.getElementById('tabAlarm').onclick = () => setTab('alarm');
    document.getElementById('tabSw').onclick = () => setTab('sw');

    // --- ЗВУК ПРИ ЗАВЕРШЕНИИ ---
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // --- ТАЙМЕР ---
    let totalSec = 300;
    let remSec = 300;
    let timerId = null;
    const circ = 2 * Math.PI * 100;

    function renderTimer() {
      const h = Math.floor(remSec / 3600);
      const m = Math.floor((remSec % 3600) / 60);
      const s = remSec % 60;
      document.getElementById('timerDisp').textContent = 
        String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      const offset = totalSec > 0 ? circ - (remSec / totalSec * circ) : 0;
      document.getElementById('prog').style.strokeDashoffset = offset;
    }

    const btnTimer = document.getElementById('btnTimerStart');
    btnTimer.onclick = function() {
      beep();
      if (!timerId) {
        if (remSec <= 0) {
          const h = parseInt(document.getElementById('h').value) || 0;
          const m = parseInt(document.getElementById('m').value) || 0;
          const s = parseInt(document.getElementById('s').value) || 0;
          totalSec = h * 3600 + m * 60 + s;
          remSec = totalSec;
        }
        if (remSec <= 0) return;
        btnTimer.textContent = 'Пауза';
        btnTimer.className = 'btn btn-stop';
        timerId = setInterval(() => {
          remSec--;
          renderTimer();
          if (remSec <= 0) {
            clearInterval(timerId);
            timerId = null;
            btnTimer.textContent = 'Старт';
            btnTimer.className = 'btn btn-main';
            alert('Время вышло!');
          }
        }, 1000);
      } else {
        clearInterval(timerId);
        timerId = null;
        btnTimer.textContent = 'Старт';
        btnTimer.className = 'btn btn-main';
      }
    };

    document.getElementById('btnTimerReset').onclick = function() {
      clearInterval(timerId);
      timerId = null;
      const h = parseInt(document.getElementById('h').value) || 0;
      const m = parseInt(document.getElementById('m').value) || 0;
      const s = parseInt(document.getElementById('s').value) || 0;
      totalSec = h * 3600 + m * 60 + s;
      remSec = totalSec;
      btnTimer.textContent = 'Старт';
      btnTimer.className = 'btn btn-main';
      renderTimer();
    };

    // --- ЧАСЫ И БУДИЛЬНИК ---
    let alarms = [];
    setInterval(() => {
      const now = new Date();
      const str = now.toTimeString().split(' ')[0];
      document.getElementById('realClock').textContent = str;
      if (now.getSeconds() === 0) {
        const hm = str.substring(0, 5);
        alarms.forEach(a => {
          if (a.time === hm) alert('Будильник: ' + a.txt);
        });
      }
    }, 1000);

    document.getElementById('btnAddAlarm').onclick = function() {
      const t = document.getElementById('alarmTime').value;
      const txt = document.getElementById('alarmTxt').value || 'Будильник';
      if (!t) return;
      alarms.push({ id: Date.now(), time: t, txt: txt });
      const row = document.createElement('div');
      row.className = 'alarm-item';
      row.innerHTML = `<span>${t} — ${txt}</span>`;
      document.getElementById('alarmList').appendChild(row);
      document.getElementById('alarmTxt').value = '';
    };

    // --- СЕКУНДОМЕР ---
    let swRun = false, swStart = 0, swEl = 0, swId = null;
    const btnSw = document.getElementById('btnSwStart');

    btnSw.onclick = function() {
      if (!swRun) {
        swStart = Date.now() - swEl;
        swId = setInterval(() => {
          swEl = Date.now() - swStart;
          const m = Math.floor(swEl / 60000);
          const s = Math.floor((swEl % 60000) / 1000);
          const ms = Math.floor((swEl % 1000) / 10);
          document.getElementById('swDisp').textContent = 
            String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + String(ms).padStart(2,'0');
        }, 40);
        swRun = true;
        btnSw.textContent = 'Стоп';
        btnSw.className = 'btn btn-stop';
      } else {
        clearInterval(swId);
        swRun = false;
        btnSw.textContent = 'Старт';
        btnSw.className = 'btn btn-main';
      }
    };

    document.getElementById('btnSwReset').onclick = function() {
      clearInterval(swId);
      swRun = false;
      swEl = 0;
      document.getElementById('swDisp').textContent = '00:00.00';
      btnSw.textContent = 'Старт';
      btnSw.className = 'btn btn-main';
    };

    renderTimer();
  </script>
</body>
</html>
